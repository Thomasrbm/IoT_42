apiVersion: apps/v1
kind: Deployment

metadata:
  name: app2
  namespace: dev

spec:
  replicas: 3

  selector:
    matchLabels:
      app: app2

  template:
    metadata:
      labels:
        app: app2

    spec:
      containers:
        - name: app2
          image: app2-web
          imagePullPolicy: Never
          ports:
            - containerPort: 80