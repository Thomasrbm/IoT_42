apiVersion: apps/v1
kind: Deployment

metadata:
  name: app1
  namespace: dev

spec:
  replicas: 1

  # il dit je suis responsable de maintenir N pods dans CE label
  selector:
    matchLabels:
      app: app1

  # le moule / comme une class cpp pour contstruire les pods.
  template:
    metadata:
      labels:
        app: app1

    spec:
      containers:
        - name: app1
          image: app1-web
          imagePullPolicy: Never
          ports:
            - containerPort: 80