apiVersion: apps/v1
kind: Deployment

metadata:
  name: app3
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app3

  template:
    metadata:
      labels:
        app: app3

    spec:
      containers:
        - name: app3
          image: app3-web
          imagePullPolicy: Never
          ports:
            - containerPort: 80